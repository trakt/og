<!doctype html>
<html lang="en" data-theme="%og.theme%">
  <head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Pre-launch: keep og.trakt.tv out of search. Remove at launch (phase 4). -->
		<meta name="robots" content="noindex, nofollow" />
		<meta property="og:site_name" content="Trakt" />
		<meta name="application-name" content="Trakt" />
		<meta name="apple-mobile-web-app-title" content="Trakt" />
		<meta name="theme-color" content="#000000" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Varela+Round&display=swap" />
		%sveltekit.head%
	</head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
