# From trakt-web. Deno + frozen install. Callers check out first (needed to find this action).
name: Set Up the Couch aka Setup Deno
description: Prepares a Deno environment with dependencies installed from the lockfile

inputs:
  deno-version:
    description: Deno version to install
    required: false
    default: v2.x

runs:
  using: composite
  steps:
    - uses: denoland/setup-deno@v2
      with:
        deno-version: ${{ inputs.deno-version }}
    - shell: bash
      run: deno task install
      working-directory: .
      working-directory: .
